# Include INSIDE the existing HTTPS server. Preserve all current game locations/CSP/root.
# Define zone at http scope: limit_req_zone $binary_remote_addr zone=rh_ops:1m rate=5r/s;
location = /ops { return 308 /ops/; }
location ^~ /ops/ {
    limit_req zone=rh_ops burst=15 nodelay;
    limit_conn rh_connections 8;
    client_max_body_size 4k;
    proxy_pass https://__OBS_PRIVATE_IP__:8444;
    proxy_ssl_trusted_certificate /etc/redhorizon-observer/tls/ca.crt;
    proxy_ssl_certificate /etc/redhorizon-observer/tls/rh-gateway.crt;
    proxy_ssl_certificate_key /etc/redhorizon-observer/tls/rh-gateway.key;
    proxy_ssl_verify on;
    proxy_ssl_verify_depth 2;
    proxy_ssl_server_name on;
    proxy_ssl_name rh-observability;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Connection "";
    proxy_connect_timeout 2s;
    proxy_read_timeout 10s;
    proxy_send_timeout 5s;
    proxy_buffering on;
    # Dedicated minimal log contains no URL, query, cookie, username or token.
    access_log off;
}
