# Include in http context via /etc/nginx/conf.d/redhorizon-observability.conf.
limit_req_zone $binary_remote_addr zone=rh_ops:1m rate=5r/s;
map $uri $rh_observed_route { default http; /ws ws; ~^/ops/ ops; }
log_format rh_observability '$msec $status $bytes_sent $request_time $limit_req_status $rh_observed_route';
