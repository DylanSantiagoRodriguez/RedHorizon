# Render __DOMAIN__ and certificate paths before nginx -t; never use eval/env secrets.
limit_req_zone $binary_remote_addr zone=rh_handshake:1m rate=1r/s;
limit_req_zone $binary_remote_addr zone=rh_http:1m rate=30r/s;
limit_conn_zone $binary_remote_addr zone=rh_connections:1m;
map $http_upgrade $rh_connection { default upgrade; '' close; }
server {
    listen 80;
    server_name __DOMAIN__;
    location /.well-known/acme-challenge/ { root /var/lib/letsencrypt; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    server_name __DOMAIN__;
    ssl_certificate /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    root /srv/redhorizon-cluster/current/frontend;
    client_max_body_size 8k;
    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 30s;
    limit_req_status 429;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=86400" always;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    location = /ws {
        limit_req zone=rh_handshake burst=10 nodelay;
        limit_conn rh_connections 12;
        proxy_pass http://127.0.0.1:8788;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $rh_connection;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 45s;
        proxy_send_timeout 15s;
        proxy_buffering off;
        access_log off; # no room hints or tokens in access logs
    }
    location = /health { limit_req zone=rh_http burst=10 nodelay; proxy_pass http://127.0.0.1:8788; access_log off; }
    location /assets/ { limit_req zone=rh_http burst=100 nodelay; expires 1y; try_files $uri =404; }
    location / { limit_req zone=rh_http burst=100 nodelay; expires -1; try_files $uri $uri/ =404; }
    location ~ /\. { deny all; }
    location /runtime { return 404; }
}
